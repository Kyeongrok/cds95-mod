name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugins into zip
        run: |
          # 배치 — 로더가 CDS95Util 루트만 훑으므로 ModUtilKR 은 루트에 두고,
          # 나머지는 만든이별 폴더에 담는다. ModUtilKR 이 뜰 때 그것들을 대신 불러온다.
          mkdir -p "dist/CDS95Util/plugins/록히드매튜"
          cp CDS95Util/ModUtilKR.plugin dist/CDS95Util/
          for f in HotelUtilKR TradeUtilKR CharacterUtilKR WorldMapKR ShipSkinKR PatchUtilKR QuestModKR UpdateUtilKR FatigueUtilKR HotkeyUtilKR HintUtilKR MarketUtilKR SaveUtilKR CityPicKR DialogUtilKR SkillUtilKR BookUtilKR ShipInfoKR; do
            cp "CDS95Util/$f.plugin" "dist/CDS95Util/plugins/록히드매튜/"
          done
          # 데이터는 루트 한 자리에 모은다 — 플러그인이 어느 폴더에 있든 여기서 찾는다.
          # cities.json / discoveries.json 이 없으면 소스에 구워 둔 표를 쓴다. 고칠 수 있게 같이 넣는다.
          # 지금 무슨 판이 깔려 있는지 — UpdateUtilKR 이 이 파일을 읽어 창에 표시한다.
          echo "${{ github.ref_name }}" > dist/CDS95Util/VERSION
          cp plugins-src/WorldMapKR/cities.json dist/CDS95Util/
          cp plugins-src/WorldMapKR/discoveries.json dist/CDS95Util/
          # PatchUtilKR 이 읽는 패치 목록. 설명문에 "동봉한 patches.json" 이라 적어 두고
          # 정작 담지 않아 새로 받은 사람은 빈 목록을 봤다. example 도 같이 넣는다.
          cp plugins-src/PatchUtilKR/patches.json dist/CDS95Util/
          cp plugins-src/PatchUtilKR/patches.json.example dist/CDS95Util/
          # 모드 — 퀘스트 묶음과 패치 묶음. 바닐라 이벤트 파일은 담지 않는다(게임 자료라
          # QuestModKR 이 첫 실행 때 각자 폴더에서 뜬다).
          cp -r CDS95Util/mods dist/CDS95Util/
          # DialogUtilKR 이 읽는 대사 파일. 없으면 아무 문구도 안 바꾸니 본보기를 같이 담는다.
          mkdir -p dist/CDS95Util/dialogs
          cp plugins-src/DialogUtilKR/dialogs/*.json dist/CDS95Util/dialogs/
          cd dist
          zip -r "../CDS95Util-${{ github.ref_name }}.zip" CDS95Util

      # 릴리즈 설명은 .github/release-notes.md 에 둔다. 여기 body: 로 적으면 통째로
      # 표현식 하나가 되어 "Exceeded max expression length 21000" 으로 워크플로가 통째로
      # 안 읽힌다(v0.4.34 를 그렇게 한 번 놓쳤다). __VERSION__ 만 태그 이름으로 바꿔 쓴다.
      - name: Build release notes
        run: sed "s/__VERSION__/${{ github.ref_name }}/g" .github/release-notes.md > notes.md

      - name: Create release (직접 작성한 KR 플러그인 zip)
        uses: softprops/action-gh-release@v2
        with:
          files: CDS95Util-${{ github.ref_name }}.zip
          generate_release_notes: true
          body_path: notes.md
